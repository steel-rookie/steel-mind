<script>
/* ===================== 공통 ===================== */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const KEYS = COMP.map(c => c.k);
const BASE_ITEMS = ['S1','S2','S3','S4','S5'];
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(1);
function gauss(){ let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
const pct = (x, d=0) => (x*100).toFixed(d);
const f0 = v => v == null || isNaN(v) ? '-' : (+v).toFixed(0);   // 비교 대상이 없으면 NaN 대신 '-'
const fmtP = p => p < .001 ? 'p<0.001' : 'p=' + p.toFixed(3);
const sigTxt = p => p < .05 ? '<span class="sig">통계적으로 유의</span>' : '<span class="ns">통계적으로 유의하지 않음</span>';
const effTxt = r => { const a = Math.abs(r); return a < .1 ? '거의 없음' : a < .3 ? '작음' : a < .5 ? '중간' : '큼'; };
const median = a => { if (!a.length) return NaN; const s = a.slice().sort((x,y) => x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
const mean = a => a.length ? a.reduce((s,x) => s+x, 0) / a.length : NaN;

/* ===================== 통계 (브라우저에서 직접 계산) ===================== */
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1/(1+0.3275911*x); const y = 1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
const pnorm = z => 0.5*(1+erf(z/Math.SQRT2));
function rankAll(arr){ arr.sort((x,y) => x.v - y.v); let i = 0, tie = 0; const N = arr.length; while (i < N){ let j = i; while (j+1 < N && arr[j+1].v === arr[i].v) j++; const r = (i+j)/2 + 1; for (let k = i; k <= j; k++) arr[k].r = r; const t = j-i+1; tie += t*t*t - t; i = j+1; } return tie; }
/** Mann-Whitney U (두 집단). r>0 이면 a 집단이 더 큼 */
function mannWhitney(a, b){
  const all = [...a.map(v => ({v, g:0})), ...b.map(v => ({v, g:1}))], N = all.length, n1 = a.length, n2 = b.length;
  if (n1 < 2 || n2 < 2) return {p:1, z:0, r:0, n1, n2, ok:false};
  const tie = rankAll(all); const R1 = all.filter(x => !x.g).reduce((s,x) => s + x.r, 0);
  const U = R1 - n1*(n1+1)/2, mu = n1*n2/2, sd = Math.sqrt(n1*n2/12*((N+1) - tie/(N*(N-1))));
  const z = sd ? (U - mu)/sd : 0; return {U, z, p:2*(1-pnorm(Math.abs(z))), r:z/Math.sqrt(N), n1, n2, ok:true};
}
/** Wilcoxon 부호순위 (같은 사람 안 비교). r>0 이면 x가 더 큼 */
function wilcoxon(pairs){
  const d = pairs.map(([x,y]) => x - y).filter(v => Math.abs(v) > 1e-12), n = d.length;
  if (n < 3) return {p:1, z:0, r:0, n, ok:false};
  const arr = d.map(v => ({v:Math.abs(v), s:Math.sign(v)})); const tie = rankAll(arr);
  const W = arr.filter(x => x.s > 0).reduce((s,x) => s + x.r, 0), mu = n*(n+1)/4, sd = Math.sqrt(n*(n+1)*(2*n+1)/24 - tie/48);
  const z = sd ? (W - mu)/sd : 0; return {z, p:2*(1-pnorm(Math.abs(z))), r:z/Math.sqrt(n), n, ok:true};
}
const LF = [0]; function lnF(n){ for (let i = LF.length; i <= n; i++) LF[i] = LF[i-1] + Math.log(i); return LF[n]; }
/** Fisher 정확검정 2x2 [[a,b],[c,d]] 양측 */
function fisher(a, b, c, d){
  const n = a+b+c+d, r1 = a+b, c1 = a+c; if (!n || !r1 || !c1 || r1 === n || c1 === n) return 1;
  const lp = x => lnF(r1)+lnF(n-r1)+lnF(c1)+lnF(n-c1)-lnF(n)-lnF(x)-lnF(r1-x)-lnF(c1-x)-lnF(n-r1-c1+x);
  const p0 = lp(a); let p = 0; for (let x = Math.max(0, r1+c1-n); x <= Math.min(r1, c1); x++){ const v = lp(x); if (v <= p0 + 1e-9) p += Math.exp(v); }
  return Math.min(1, p);
}

/* ===================== 가상 기수 만들기 (설명용) =====================
   가정: 신입은 경력보다 각 역량이 평균적으로 낮고, 재촉을 받으면 확인을 덜 한다.
   이 가정이 결과에 그대로 반영되므로, 가상 데이터만으로 낸 결론은 "보고서가 이렇게 나온다"는 예시일 뿐이다. */
const MEANS = { '신입':{HAZ:.6, PPL:.62, CAU:.42, ADP:.55, COM:.45, PRS:.38}, '경력':{HAZ:.8, PPL:.86, CAU:.76, ADP:.72, COM:.78, PRS:.76} };
function pickBy(cs, sk){
  const w = cs.map(c => { const e = Object.entries(c.ev); return Math.pow(e.reduce((t,[k,v]) => t + 1 - Math.abs(sk[k] - v), 0) / e.length, 8); });
  let r = rnd() * w.reduce((a,b) => a+b, 0); for (let i = 0; i < w.length; i++){ r -= w[i]; if (r <= 0) return i; } return 0;
}
function simItem(id, sk){
  const sc = SC[id];
  if (sc.kind === 'handover'){ const ho = {}; sc.items.forEach((it,i) => { ho[i] = it.truth === 'done' ? (rnd() < .75 ? 'done' : 'skip') : it.buried ? (rnd() < sk.COM ? 'open' : 'done') : (rnd() < sk.COM + .2 ? 'open' : rnd() < .5 ? 'done' : 'skip'); }); return {id, ho}; }
  const press = !!sc.pressure, pf = press ? .35 + .65*sk.PRS : 1;
  const order = sc.probes.map(p => ({p, w:rnd() * (p.key ? 1 + 2*sk[p.key] : .5)})).sort((a,b) => b.w - a.w).map(o => o.p);
  const probes = order.filter(p => rnd() < (p.key ? sk[p.key] : sk.COM*.5) * pf).map(p => p.id);
  const cue = sc.cue ? rnd() < sk.HAZ*pf : false;
  const report = sc.report ? (rnd() < sk.COM*pf ? sc.report.slice() : rnd() < .4 ? [sc.report[0]] : []) : [];
  const kp = sc.probes.filter(p => p.key), frac = kp.length ? kp.filter(p => probes.includes(p.id)).length / kp.length : 1;
  const sk2 = {...sk, CAU:sk.CAU*(.5 + .5*frac), HAZ:sk.HAZ*(.6 + .4*frac)};
  let ci = pickBy(sc.choices, sk2), to = false;
  let sec = 4 + probes.length*2.6 + rnd()*5; if (press) sec *= .5 + .5*sk.PRS;
  if (press && sk.PRS < .35 && rnd() < .35){ to = true; ci = sc.choices.findIndex(c => c.def); sec = sc.t; }
  const ci2 = sc.update && !sc.choices[ci].noUpdate ? pickBy(sc.update.choices, sk) : null;
  return {id, ci, ci2, sec:Math.min(sc.t, Math.round(sec*10)/10), to, probes, report, cue, pressure:press};
}
function simPlayer(role, i){
  const m = MEANS[role], sk = Object.fromEntries(KEYS.map(k => [k, clamp(m[k] + gauss()*.14, .05, .95)]));
  const rest = ['S3','S4','S5'].sort(() => rnd() - .5).slice(0, 2);
  const weakest = KEYS.slice().sort((a,b) => sk[a] - sk[b])[0];
  const ids = ['S1','S2', ...rest, SURPRISE_FOR[weakest], 'H1'];
  return {pid:(role === '신입' ? 'N' : 'E') + String(i+1).padStart(2,'0'), role, source:'가상', items:ids.map(id => simItem(id, sk))};
}

/* ===================== 실제 진단 기록 불러오기 (2.0 시연의 JSON) ===================== */
let REAL = [];
function fromRun(js, name, idx){
  if (js.format !== 'steelmind-run-v2') throw new Error('형식이 steelmind-run-v2 가 아님');
  if (js.source === 'unity' || Array.isArray(js.competencies)) return fromUnity(js, name, idx);
  const items = (js.log || []).filter(l => l.type === 'result' && SC[l.id]).map(l => {
    const sc = SC[l.id];
    if (sc.kind === 'handover') return {id:l.id, ho:l.ho || null};
    const ci = Number.isInteger(l.ci) ? l.ci : sc.choices.findIndex(c => c.l === l.choice);
    const ci2 = Number.isInteger(l.ci2) ? l.ci2 : sc.update && l.choice2 ? sc.update.choices.findIndex(c => c.l === l.choice2) : null;
    return {id:l.id, ci, ci2, sec:typeof l.sec === 'number' ? l.sec : null, to:!!l.to, probes:l.probes || [], report:l.report || [], cue:!!l.cue, pressure:!!sc.pressure};
  }).filter(it => it.ho !== null && (it.ho || it.ci >= 0));
  return {pid:'R' + String(idx+1).padStart(2,'0'), role:js.role === '경력' ? '경력' : '신입', source:js.virtual ? '자동 시연' : '실제', origin:'html', file:name, comps:COMP, items};
}
/* Unity 기록: 역량 점수는 Unity 규칙 엔진이 낸 값(0~100)을 그대로 쓰고, 사건 정보(제목·최선·사고)는 기록에 들어 있다.
   판단 전 확인 행동·알린 대상·인계는 아직 기록하지 않으므로 빈 값으로 둔다 (그 분석은 "기록 없음"으로 표시). */
function fromUnity(js, name, idx){
  const comps = (js.competencies || []).map(c => ({k:c.key, n:c.name}));
  const items = (js.log || []).filter(l => l.type === 'result' && Number.isInteger(l.ci)).map(l => ({id:l.id, ci:l.ci, ci2:null,
    sec:typeof l.sec === 'number' && l.sec >= 0 ? l.sec : null, to:!!l.to, probes:[], report:[], cue:false, pressure:!!l.pressure,
    u:{title:l.title || l.id, kind:l.kind || 'base', best:!!l.best, acc:!!l.accident, choice:l.choice || ('선택 ' + (l.ci + 1))}}));
  const score = Object.fromEntries(comps.map(c => { const v = (js.scores || {})[c.k], n = (js.counts || {})[c.k]; return [c.k, typeof v !== 'number' || n === 0 ? null : v/100]; }));
  return {pid:'U' + String(idx+1).padStart(2,'0'), role:js.role === '경력' ? '경력' : '신입', source:js.virtual ? '자동 시연' : '실제', origin:'unity', file:name, comps, items, fixedScore:score};
}
/** 사건 하나의 공통 정보 (HTML 시연은 상황 은행에서, Unity는 기록에서). 판단 사건이 아니면 null */
function info(it){
  if (it.u) return {title:it.u.title, kind:it.u.kind, best:it.u.best, acc:it.u.acc, label:it.u.choice, pressure:it.pressure};
  const sc = SC[it.id]; if (!sc || sc.kind === 'handover') return null;
  const c = sc.choices[it.ci]; if (!c) return null;
  return {title:sc.title, kind:sc.kind, best:!!c.best, acc:!!c.acc, label:c.l, pressure:!!sc.pressure};
}

/* ===================== 한 사람 점수 (2.0 시연과 같은 규칙) ===================== */
function scorePlayer(p){
  if (p.fixedScore){
    const d = {best:0, items:0, keyAll:0, keySeen:0, pr:{seen:0, all:0, sec:[]}, np:{seen:0, all:0, sec:[]}, timeouts:0, accident:0, ho:null};
    for (const it of p.items){ const f = info(it); if (!f) continue; d.items++; if (f.best) d.best++; if (f.acc) d.accident++; if (it.to) d.timeouts++;
      if (it.sec != null && !it.to) (f.pressure ? d.pr : d.np).sec.push(it.sec); }
    p.score = p.fixedScore; p.d = d; return p;
  }
  p.comps = p.comps || COMP;
  const est = Object.fromEntries(KEYS.map(k => [k, {a:1, b:1, n:0}]));
  const up = (k, v, w) => { const e = est[k]; e.a += w*v; e.b += w*(1-v); e.n++; };
  const d = {best:0, items:0, keyAll:0, keySeen:0, pr:{seen:0, all:0, sec:[]}, np:{seen:0, all:0, sec:[]}, timeouts:0, accident:0, ho:null};
  for (const it of p.items){
    const sc = SC[it.id];
    if (sc.kind === 'handover'){
      if (!it.ho) continue;
      const keys = sc.items.map((x,i) => ({...x, i})).filter(x => x.key);
      const open = keys.filter(x => it.ho[x.i] === 'open').length, buried = keys.filter(x => it.ho[x.i] === 'done').length;
      up('COM', open/keys.length, 1.5); const s = keys.find(x => x.safety); up('HAZ', it.ho[s.i] === 'open' ? 1 : 0, .6);
      d.ho = {open, buried, total:keys.length, sensorBuried:it.ho[keys.findIndex(x => x.buried) >= 0 ? keys.find(x => x.buried).i : -1] === 'done'};
      continue;
    }
    const w = sc.kind === 'surprise' ? 1.5 : 1, c1 = sc.choices[it.ci]; if (!c1) continue;
    d.items++; if (c1.best) d.best++; if (c1.acc) d.accident++; if (it.to) d.timeouts++;
    Object.entries(c1.ev).forEach(([k,v]) => up(k, v, w));
    if (it.to) up('PRS', 0, 1);
    if (sc.pressure && !it.to && c1.ev.PRS === undefined) up('PRS', c1.best ? 1 : .4, .5);
    const kp = sc.probes.filter(x => x.key), seen = kp.filter(x => it.probes.includes(x.id)).length;
    const byK = {}; kp.forEach(x => { (byK[x.key] ||= {s:0, a:0}); byK[x.key].a++; if (it.probes.includes(x.id)) byK[x.key].s++; });
    Object.entries(byK).forEach(([k,o]) => up(k, o.s/o.a, .6));
    if (sc.cue) up('HAZ', it.cue ? 1 : 0, 1);
    if (sc.report){ const hit = sc.report.filter(r => it.report.includes(r)).length; up('COM', hit === sc.report.length ? 1 : hit ? .5 : 0, .6); }
    if (it.ci2 != null && sc.update && sc.update.choices[it.ci2]) Object.entries(sc.update.choices[it.ci2].ev).forEach(([k,v]) => up(k, v, w));
    if (kp.length){ d.keyAll += kp.length; d.keySeen += seen; const g = sc.pressure ? d.pr : d.np; g.all += kp.length; g.seen += seen; if (it.sec != null && !it.to) g.sec.push(it.sec); }
  }
  p.score = Object.fromEntries(KEYS.map(k => [k, est[k].n ? est[k].a/(est[k].a + est[k].b) : null]));
  p.d = d; return p;
}

/* ===================== 그림 (SVG) ===================== */
const CA = '#e07a2f', CB = '#2f6fe0';
function groupedBars(rows, opt = {}){
  const hasMark = rows.some(r => r.mark), W = 760, L = opt.left || 170, rowH = 40, H = rows.length*rowH + 26, max = opt.max || 100, x = v => L + (W - L - (hasMark ? 130 : 60)) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" class="chart" role="img">`;

/* ===================== 분석 → 발견 카드 → 보고서 ===================== */
let LAST = null;
function analyze(players){
  const N = players.filter(p => p.role === '신입'), E = players.filter(p => p.role === '경력');
  const C = {};
  // C1 역량 차이
  const ALL = []; players.forEach(p => (p.comps || COMP).forEach(c => { if (!ALL.some(x => x.k === c.k)) ALL.push(c); }));
  C.compDefs = ALL;
  C.comp = ALL.map(c => {
    const a = E.map(p => p.score[c.k]).filter(v => v != null), b = N.map(p => p.score[c.k]).filter(v => v != null);
    return {k:c.k, n:c.n, exp:mean(a)*100, new:mean(b)*100, t:mannWhitney(a, b)};
  });
  // C2 근거 확인 vs 최선 선택 (사건 단위, 기수 전체)
  let hiB = 0, hiN = 0, loB = 0, loN = 0;
  players.forEach(p => p.items.forEach(it => { const sc = SC[it.id]; if (!sc || sc.kind === 'handover' || it.to) return; const kp = sc.probes.filter(x => x.key); if (!kp.length || !sc.choices[it.ci]) return;
    const hi = kp.filter(x => it.probes.includes(x.id)).length / kp.length >= .5, b = sc.choices[it.ci].best ? 1 : 0; if (hi){ hiN++; hiB += b; } else { loN++; loB += b; } }));
  C.check = {hiB, hiN, loB, loN, hiR:hiN ? hiB/hiN : 0, loR:loN ? loB/loN : 0, p:fisher(hiB, hiN - hiB, loB, loN - loB)};
  C.checkRate = {new:mean(N.filter(p => p.d.keyAll).map(p => p.d.keySeen/p.d.keyAll))*100, exp:mean(E.filter(p => p.d.keyAll).map(p => p.d.keySeen/p.d.keyAll))*100,
    t:mannWhitney(E.filter(p => p.d.keyAll).map(p => p.d.keySeen/p.d.keyAll), N.filter(p => p.d.keyAll).map(p => p.d.keySeen/p.d.keyAll))};
  // C3 재촉 → 확인률 (같은 사람 안)
  const press = g => { const pp = g.filter(p => p.d.pr.all && p.d.np.all); return {n:pp.length, np:mean(pp.map(p => p.d.np.seen/p.d.np.all))*100, pr:mean(pp.map(p => p.d.pr.seen/p.d.pr.all))*100, t:wilcoxon(pp.map(p => [p.d.np.seen/p.d.np.all, p.d.pr.seen/p.d.pr.all]))}; };
  C.press = {new:press(N), exp:press(E)};
  // C4 결정 시간
  const secs = g => { const pp = g.filter(p => p.d.pr.sec.length && p.d.np.sec.length); return {n:pp.length, np:median(pp.map(p => median(p.d.np.sec))), pr:median(pp.map(p => median(p.d.pr.sec))), t:wilcoxon(pp.map(p => [median(p.d.np.sec), median(p.d.pr.sec)]))}; };
  C.sec = {new:secs(N), exp:secs(E)};
  C.timeouts = {new:N.filter(p => p.d.timeouts).length, exp:E.filter(p => p.d.timeouts).length};
  // 사고로 이어질 선택이 재촉 사건에서 나왔는지
  let accP = 0, accA = 0, itP = 0, itA = 0;
  players.forEach(p => p.items.forEach(it => { const f = info(it); if (!f) return; itA++; if (f.pressure) itP++; if (f.acc){ accA++; if (f.pressure) accP++; } }));
  C.acc = {press:accP, all:accA, itP, itA};
  // C5 사건별 최선 선택률
  const ids = [], first = {}; players.forEach(p => p.items.forEach(it => { const f = info(it); if (f && !ids.includes(it.id)){ ids.push(it.id); first[it.id] = f; } }));
  C.items = ids.map(id => {
    const g = arr => { const xs = arr.flatMap(p => p.items.filter(it => it.id === id && info(it))), labels = {}; xs.forEach(it => labels[it.ci] = info(it).label);
      const top = Math.max(-1, ...xs.map(it => it.ci)); return {n:xs.length, best:xs.filter(it => info(it).best).length, acc:xs.filter(it => info(it).acc).length, picks:[...Array(top + 1)].map((_,i) => xs.filter(it => it.ci === i).length), labels}; };
    const a = g(N), b = g(E); return {id, title:first[id].title, kind:first[id].kind, new:a, exp:b, p:fisher(a.best, a.n - a.best, b.best, b.n - b.best)};
  }).filter(r => r.new.n + r.exp.n > 0);
  C.gaps = C.items.filter(r => r.new.n >= 5 && r.exp.n >= 3).map(r => ({...r, gap:r.exp.best/r.exp.n - r.new.best/r.new.n})).filter(r => r.gap > 0).sort((a,b) => a.p - b.p || b.gap - a.gap);
  // C6 인계
  const ho = g => { const pp = g.filter(p => p.d.ho); return {n:pp.length, all:pp.filter(p => p.d.ho.open === p.d.ho.total).length, buried:pp.filter(p => p.d.ho.buried > 0).length, sensor:pp.filter(p => p.d.ho.sensorBuried).length}; };
  C.ho = {new:ho(N), exp:ho(E)}; C.ho.p = fisher(C.ho.new.all, C.ho.new.n - C.ho.new.all, C.ho.exp.all, C.ho.exp.n - C.ho.exp.all);
  // C7 노하우: 경력자가 최선을 고를 때 처음 확인한 근거

    const sc = SC[id]; const first = (arr, onlyBest) => { const cnt = {}; let n = 0; arr.forEach(p => p.items.filter(it => it.id === id && it.probes.length && (!onlyBest || (sc.choices[it.ci] || {}).best)).forEach(it => { n++; cnt[it.probes[0]] = (cnt[it.probes[0]] || 0) + 1; })); const top = Object.entries(cnt).sort((a,b) => b[1] - a[1])[0]; return {n, top:top ? top[0] : null, cnt:top ? top[1] : 0, none:arr.reduce((s,p) => s + p.items.filter(it => it.id === id && !it.probes.length).length, 0)}; };

    return {id, title:sc.title, exp:e, new:nn, expL:pr(e.top), newL:pr(nn.top), share:e.n ? e.cnt/e.n : 0};

  const has = {check:C.check.hiN + C.check.loN > 0, press:C.press.new.n + C.press.exp.n > 0, sec:C.sec.new.n + C.sec.exp.n > 0, ho:C.ho.new.n + C.ho.exp.n > 0, know:C.know.length > 0};
  return {N, E, C, players, has};
}

function cardList(A){

      return {text:s.text, ids, bad};
    });
    const ok = rows.filter(r => !r.bad).length;
    out.innerHTML = `<div class="ai"><span class="src">AI 해설 · Gemini 2.5 Flash · ${((performance.now() - t0)/1000).toFixed(1)}초 · 검사 통과 ${ok}/${rows.length}</span>
      <ol>${rows.map(r => `<li>${r.bad ? `<span class="muted">[막힘: ${r.bad}] ${r.text || ''}</span>` : r.text} ${r.ids.map(id => `<span class="tag" data-c="${id}">${id}</span>`).join('')}</li>`).join('')}</ol>
      <div class="small muted">검사: 근거 카드가 있어야 하고, 숫자는 그 카드에 있는 것만, 평가·배치 표현 금지. 막힌 문장은 보고서에 쓰지 않습니다.</div></div>`;
    out.querySelectorAll('.tag[data-c]').forEach(t => t.onclick = () => { const c = document.getElementById('card-' + t.dataset.c); if (c){ c.scrollIntoView({behavior:'smooth', block:'center'}); c.classList.add('hl'); setTimeout(() => c.classList.remove('hl'), 1800); } });
  } catch (e) { out.innerHTML = `<div class="ai"><span class="src">AI 해설 · 실패</span><br>${e.message}. 보고서 본문은 규칙 계산 문장으로 그대로 씁니다.</div>`; }
}

document.getElementById('regen').onclick = render;
document.getElementById('useVirt').onchange = render;
document.getElementById('aiBtn').onclick = aiSummary;
document.getElementById('files').onchange = async e => {
  const fs = [...e.target.files]; let bad = 0;
  for (const f of fs){ try { const js = JSON.parse(await f.text()); REAL.push(fromRun(js, f.name, REAL.length)); } catch (err) { bad++; } }
  if (bad) alert(bad + '개 파일을 읽지 못했습니다 (steelmind-run-v2 진단 기록 JSON인지 확인).');
  render();
};
render();
</script>
</body>
